name: sds320-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # torch 2.2.2 is the last release for Intel Macs and needs numpy < 2
      - torch==2.2.2
      - torchvision==0.17.2
      - numpy==1.26.4
      - torchgeo==0.10.1
      - lightning==2.6.6
      - geopandas==1.1.4
      - pyproj==3.7.2
      - pyogrio==0.13.0
      - rasterio==1.4.3
      - shapely==2.2.0
      - scipy==1.17.1
      - scikit-image==0.25.2
      - pandas==2.3.3
      - matplotlib==3.11.2
      - pillow==13.0.0
      - pystac-client==0.9.1
      - fsspec==2026.9.0
      - aiohttp==3.14.5
      - requests==2.34.2
      - folium==1.0.0
      - mercantile==1.2.1
      - ipykernel==7.4.0
      - nbformat==5.11.1
      - nbclient==0.11.0
